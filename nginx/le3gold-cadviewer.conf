# CAD Viewer for TOS 7 - portal route (WebUI External Open).
#
# DEBIAN/postinst copies this file to /etc/nginx/conf.d/le3gold-cadviewer.conf
# and reloads nginx; DEBIAN/prerm removes it again. The platform does NOT pick
# the snippet up from /usr/local/<appid>/nginx/ on its own, so the copy is what
# makes the route exist - without it the application is only reachable on its
# bare port, which is what config.ini must not point "path" at.
#
# The location prefix must stay identical to config.ini "path" and to
# URL_PREFIX in le3gold-cadviewer.env.
location /le3gold-cadviewer/ {
    proxy_pass http://127.0.0.1:17868/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The viewer streams model data; do not buffer it and do not cut a slow
    # parse off early.
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}
